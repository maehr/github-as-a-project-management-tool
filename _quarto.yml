project:
  type: website
  render:
    - index.qmd
    - course/**/*.qmd
    - documentation/**/*.qmd
    - project-management/**/*.md
    - slides/**/*.qmd
    - templates/**/*.md
    - templates/master-thesis/README.md
    - CHANGELOG.md
    - NOTICE.md
    - LICENSE-CCBY.md
    - LICENSE-AGPL.md
    - CODE_OF_CONDUCT.md
    - CONTRIBUTING.md
    - SECURITY.md
    # Frozen snapshots; see archive/README.md
    - '!archive/'
  resources:
    - data/synthetic-periodicals.csv
    - course/schedule.yml
    - templates/master-thesis/issue-forms/*.yml

lang: en-GB

website:
  title: GitHub as a Project Management Tool
  description: Workshop and OER on planning, conducting, documenting, and sharing a fictional master's thesis with GitHub, in the browser or on the command line.
  favicon: android-chrome-512x512.png
  open-graph: true
  site-url: https://maehr.github.io/github-as-a-project-management-tool/
  repo-url: https://github.com/maehr/github-as-a-project-management-tool/
  issue-url: https://github.com/maehr/github-as-a-project-management-tool/issues/new/choose
  repo-actions: [edit, issue]
  page-navigation: true
  bread-crumbs: true
  back-to-top-navigation: true
  search:
    show-item-context: true
    type: overlay
  navbar:
    logo: android-chrome-512x512.png
    logo-alt: 'Home'
    title: GitHub as a Project Management Tool
    tools:
      - icon: github
        href: https://github.com/maehr/github-as-a-project-management-tool/
        aria-label: GitHub repository
    left:
      - text: Setup
        href: course/setup.qmd
      - text: Syllabus
        href: course/syllabus.qmd
      - text: Exercises
        href: course/exercises/x1.qmd
      - text: Cheat sheet
        href: course/cheat-sheet.qmd
      - text: Slides
        href: slides/index.qmd
      - text: Worked example
        href: documentation/index.qmd

  sidebar:
    contents:
      - text: Home
        href: index.qmd
      - section: Start here
        contents:
          - course/setup.qmd
          - course/syllabus.qmd
          - course/approaches.qmd
      - section: Core exercises
        contents:
          - course/exercises/x1.qmd
          - course/exercises/x2.qmd
          - course/exercises/x3.qmd
          - course/exercises/x4.qmd
      - section: Optional extensions
        contents:
          - course/exercises/x5.qmd
          - course/exercises/x6.qmd
      - section: Help
        contents:
          - course/cheat-sheet.qmd
          - course/solutions.qmd
          - course/after.qmd
          - course/instructor-notes.qmd
      - section: Worked example
        href: documentation/index.qmd
        contents:
          - text: Showcase Project (GitHub)
            href: https://github.com/users/maehr/projects/11
          - text: Example repository (GitHub)
            href: https://github.com/maehr/projm-example-thesis
          - documentation/requirements.qmd
          - documentation/publication.qmd
          - text: Thesis documentation template
            href: templates/master-thesis/README.md
      - section: About
        contents:
          - project-management/decisions.md
          - project-management/risks.md
          - CHANGELOG.md
          - NOTICE.md
          - text: Licence (prose and data)
            href: LICENSE-CCBY.md
          - text: Licence (code)
            href: LICENSE-AGPL.md
          - CODE_OF_CONDUCT.md
          - CONTRIBUTING.md
          - SECURITY.md

  page-footer:
    left:
      - text: Prose and data under CC BY 4.0
        href: LICENSE-CCBY.md
      - text: Code under AGPL 3.0
        href: LICENSE-AGPL.md
      - text: 'Screenshots: GitHub interface © GitHub, Inc.'
        href: NOTICE.md
    right:
      - text: KSL 526141, HS2026, University of Bern
        href: https://www.ksl.unibe.ch/KSL/kurzansicht?stammNr=526141&semester=HS2026&lfdNr=0

format:
  html:
    toc: true
    theme:
      - cosmo
      - brand
      - theme.scss
    css: styles.css
    code-copy: true
    code-overflow: wrap
    canonical-url: true
    lightbox: true
    link-external-icon: true
    link-external-newwindow: true
