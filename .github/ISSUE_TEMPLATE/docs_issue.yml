name: Report a course content error
description: A step, a screenshot, a link, or a fact in the course is wrong or out of date.
title: 'docs: <short description>'
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: The GitHub interface changes often. Give the date when you saw the problem.
  - type: input
    id: page
    attributes:
      label: Page or file
      description: The URL of the page, or the path of the file.
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Exercise and step
      description: For example, X2 step 4. Leave empty if it does not apply.
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Describe what you saw and what you expected.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date seen
      placeholder: 'YYYY-MM-DD'
    validations:
      required: true
