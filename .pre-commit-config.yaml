repos:
  - repo: local
    hooks:
      - id: check-gate
        name: Check gate (npm run check)
        entry: npm run check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff Format
        entry: bash -c 'if command -v uv >/dev/null 2>&1 && uv run ruff --version >/dev/null 2>&1; then uv run ruff format "$@"; else exit 0; fi' --
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-lint
        name: Ruff Lint
        entry: bash -c 'if command -v uv >/dev/null 2>&1 && uv run ruff --version >/dev/null 2>&1; then uv run ruff check "$@"; else exit 0; fi' --
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ty-check
        name: Ty Check
        entry: bash -c 'if command -v uv >/dev/null 2>&1 && uv run ty --version >/dev/null 2>&1; then uv run ty check "$@"; else exit 0; fi' --
        language: system
        types: [python]
        stages: [pre-commit]

      - id: commitlint
        name: Commitlint
        entry: npx commitlint --edit
        language: system
        stages: [commit-msg]
