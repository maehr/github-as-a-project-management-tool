# Screenshot annotations for the course pages.
#
# Raw captures come from the GitHub web interface in Google Chrome on
# 12 October 2026, signed in as the instructor, at a viewport of 1200 x 735
# pixels. They stay in assets/screenshots/raw/ and are not committed.
# Coordinates (x0, y0, x1, y1) refer to the raw capture.
# Privacy review: crops remove the account menu, the avatar, and the
# notification indicator in the page header. The remaining content shows only
# the public demo repositories, synthetic data, and the instructor's public
# GitHub name.
#
# Run `npm run screenshots:annotate` after a change.

captured: 2026-10-12

