# Run of show for Friday, 16 October 2026, 09:00-13:00.
# Revised after the session (decision D-014): X1-X4 form the core workshop.
# X5 and X6 are optional extensions; the consolidation block leaves room for them.
# course/syllabus.qmd includes the rendered table.
# `npm run check` verifies that the blocks are contiguous, that they fill
# exactly 240 minutes, that the breaks take 20 minutes, and that the
# schedule holds the core exercises X1-X4 and no optional exercise.

date: 2026-10-16
start: '09:00'
end: '13:00'
total_minutes: 240
break_minutes: 20

blocks:
  - start: '09:00'
    end: '09:15'
    kind: frame
    title: Frame the thesis workflow
    activity: Compare project-management approaches and the GitHub objects that support them.
    result: Know the four steps of the core workflow and the limits of the tool.
  - start: '09:15'
    end: '09:45'
    kind: exercise
    id: X1
    title: Create the repository
    activity: Create a repository from the template.
    result: A repository with a README and a checked visibility.
  - start: '09:45'
    end: '10:25'
    kind: exercise
    id: X2
    title: Turn requirements into work
    activity: Create epics, sub-issues, and one user story with acceptance criteria.
    result: Two epics with their sub-issues, one of them derived from a requirement.
  - start: '10:25'
    end: '10:35'
    kind: break
    title: Break
  - start: '10:35'
    end: '11:20'
    kind: exercise
    id: X3
    title: Configure the Project
    activity: Create the milestones, copy and link the Project, set priorities and dates, and record a dependency.
    result: A Project with the views Backlog, Board, and Roadmap, and one dependency.
  - start: '11:20'
    end: '12:00'
    kind: exercise
    id: X4
    title: Complete one documentation task
    activity: Edit on a branch, open a pull request, review, merge, and close the Issue.
    result: One Issue closed by a merged pull request.
  - start: '12:00'
    end: '12:10'
    kind: break
    title: Break
  - start: '12:10'
    end: '12:45'
    kind: consolidate
    title: Consolidate and extend
    activity: Ask questions, fix problems, finish X1–X4, or start an optional extension.
    result: 'A working core workflow. Optional: [X5](exercises/x5.qmd) or [X6](exercises/x6.qmd).'
  - start: '12:45'
    end: '13:00'
    kind: close
    title: Transfer to a private thesis and closing reflection
    activity: Plan the move to a private repository and a private Project.
    result: One next step for your own thesis.
