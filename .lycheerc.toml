# Lychee configuration for link checking
# https://lychee.cli.rs/configuration/

exclude = [
  # The site is not deployed until the maintainer approves it.
  "https://maehr.github.io/github-as-a-project-management-tool/",
  # GitHub pages that need a signed-in user or return 404 to bots.
  "https://github.com/new",
  "https://github.com/settings/",
  "https://github.com/maehr/github-as-a-project-management-tool/issues/new",
  # Hosts that reject automated requests.
  "https://www.gnu.org/licenses/",
  "https://fsf.org/",
  "https://www.contributor-covenant.org/",
]

timeout = 20
max_retries = 2
format = "compact"
no_progress = true
cache = true
max_cache_age = "7d"
accept = ["100..=103", "200..=299", "429", "503", "521", "522", "524"]
