[project]
name = "github-as-a-project-management-tool"
version = "0.1.0"
description = "Maintainer tooling for the course 'GitHub as a Project Management Tool'"
authors = [{ name = "Moritz Mähr" }]
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = []

# Maintainer tooling only. Learners need a browser and a GitHub account.
[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[tool.ty.environment]
extra-paths = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG", # flake8-unused-arguments
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line too long, handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
